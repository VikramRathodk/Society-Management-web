<div class="page-header">
  <h1>My profile</h1>
</div>

@if (auth.user(); as user) {
  <div class="cards">
    <mat-card appearance="outlined">
      <mat-card-header>
        <mat-card-title>Details</mat-card-title>
        <mat-card-subtitle>{{ user.phone }}</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <form [formGroup]="form" (ngSubmit)="save()">
          <mat-form-field appearance="outline">
            <mat-label>Name</mat-label>
            <input matInput formControlName="name" autocomplete="name" />
            @if (form.controls.name.invalid) {
              <mat-error>Name is required</mat-error>
            }
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Email</mat-label>
            <input matInput formControlName="email" type="email" autocomplete="email" />
            @if (form.controls.email.invalid) {
              <mat-error>Enter a valid email</mat-error>
            }
          </mat-form-field>
          @if (canEdit()) {
            <div class="form-actions">
              <button mat-flat-button type="submit" [disabled]="form.pristine || saving()">
                Save
              </button>
            </div>
          }
        </form>
      </mat-card-content>
    </mat-card>

    <mat-card appearance="outlined">
      <mat-card-header>
        <mat-card-title>My roles</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <mat-list>
          @for (a of user.roles; track a.id) {
            <mat-list-item>
              <span matListItemTitle>{{ a.roleName }}</span>
              <span matListItemLine>{{ roleContext(a) }}</span>
            </mat-list-item>
          }
        </mat-list>
      </mat-card-content>
    </mat-card>
  </div>
}
