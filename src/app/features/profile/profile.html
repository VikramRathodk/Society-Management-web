<app-page-header title="My profile" subtitle="Your details and the roles you hold" />

@if (auth.user(); as user) {
  <div class="cards">
    <app-section title="Details" [subtitle]="user.phone" padded>
      <form [formGroup]="form" (ngSubmit)="save()">
        <mat-form-field appearance="outline">
          <mat-label>Name</mat-label>
          <input matInput formControlName="name" autocomplete="name" />
          @if (form.controls.name.invalid) {
            <mat-error>Name is required</mat-error>
          }
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" autocomplete="email" />
          @if (form.controls.email.invalid) {
            <mat-error>Enter a valid email</mat-error>
          }
        </mat-form-field>
        @if (canEdit()) {
          <div class="form-actions">
            <button mat-flat-button type="submit" [disabled]="form.pristine || saving()">
              Save
            </button>
          </div>
        }
      </form>
    </app-section>

    <app-section title="My roles">
      <mat-list>
        @for (a of user.roles; track a.id) {
          <mat-list-item>
            <span matListItemTitle>{{ a.roleName }}</span>
            <span matListItemLine>{{ roleContext(a) }}</span>
          </mat-list-item>
        }
      </mat-list>
    </app-section>
  </div>
}
