<app-page-header
  [title]="society()?.name ?? 'Society'"
  subtitle="Society settings"
  back="/societies"
  backLabel="Back to societies"
>
  @if (society(); as s) {
    <a mat-stroked-button [routerLink]="['/societies', s.id, 'setup']">
      <mat-icon>checklist</mat-icon>
      {{ s.status === 'SETUP' ? 'Continue setup' : 'Setup tools' }}
    </a>
  }
</app-page-header>

@if (loading()) {
  <app-skeleton variant="form" />
} @else if (society(); as s) {
  <app-section
    title="Profile"
    subtitle="Shown to everyone in this society"
    padded
    class="settings-card"
  >
    <app-society-profile-form [society]="s" (saved)="saved($event)" />
  </app-section>

  <app-society-rules [societyId]="id()" class="rules" />
} @else {
  <app-empty-state icon="search_off" message="This society could not be found.">
    <a mat-button routerLink="/societies">Back to societies</a>
  </app-empty-state>
}
