<app-page-header
  [title]="society()?.name ?? 'Society'"
  subtitle="Society settings"
  back="/societies"
  backLabel="Back to societies"
/>

@if (loading()) {
  <mat-progress-bar mode="indeterminate" />
} @else if (!society()) {
  <app-empty-state icon="search_off" message="This society could not be found.">
    <a mat-button routerLink="/societies">Back to societies</a>
  </app-empty-state>
} @else {
  <app-section
    title="Profile"
    subtitle="Shown to everyone in this society"
    padded
    class="settings-card"
  >
    <form [formGroup]="form" (ngSubmit)="save()">
      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" />
        @if (form.controls.name.invalid) {
          <mat-error>Name is required</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Address</mat-label>
        <textarea matInput formControlName="address" rows="3"></textarea>
      </mat-form-field>

      @if (error(); as message) {
        <p class="form-error" role="alert">{{ message }}</p>
      }

      <div class="form-actions">
        <button mat-flat-button type="submit" [disabled]="form.pristine || saving()">Save</button>
      </div>
    </form>
  </app-section>
}
