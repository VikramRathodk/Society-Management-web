<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sahvasa</title>
    <meta
      name="description"
      content="Sahvasa — living together, managed well. Visitor management, maintenance billing, accounts and bank reconciliation for housing societies in India."
    />
    <meta name="application-name" content="Sahvasa" />
    <meta name="apple-mobile-web-app-title" content="Sahvasa" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="favicon.ico" />
    <meta name="theme-color" content="#0f766e" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Inter:opsz,wght@14..32,400..700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block"
      rel="stylesheet"
    />
    <script>
      // Apply the saved light/dark choice before the app loads, so the page doesn't flash.
      try {
        var mode = localStorage.getItem('sm.theme');
        if (mode === 'light' || mode === 'dark') {
          document.documentElement.classList.add('theme-' + mode);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
